spring:
  application:
    name: hr
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://localhost:5432/pet
    password: admin
    username: admin
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method